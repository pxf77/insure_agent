name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Run contract evaluations
        run: |
          python -m quant_agent.cli eval contracts --suite evals/contracts/v0.1.yaml
          python -m quant_agent.cli eval contracts --suite evals/contracts/v0.1-hardening.yaml

      - name: Run data and PIT evaluations
        run: python -m quant_agent.cli eval data --suite evals/data/v0.2.yaml

      - name: Verify data snapshot smoke flow
        run: |
          python -m quant_agent.cli data snapshot \
            --config configs/env/dev.yaml \
            --project-root /tmp/quant-agent-smoke \
            --as-of 2026-05-21T16:00:00+08:00

      - name: Verify contract schema export
        run: python -m quant_agent.cli contracts export --output /tmp/quant-agent-contracts

  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check src tests scripts

      - name: Run mypy
        run: mypy src
