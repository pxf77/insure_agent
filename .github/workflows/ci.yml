name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Run contract evaluations
        run: |
          python -m quant_agent.cli eval contracts --suite evals/contracts/v0.1.yaml
          python -m quant_agent.cli eval contracts --suite evals/contracts/v0.1-hardening.yaml

      - name: Run data and PIT evaluations
        run: python -m quant_agent.cli eval data --suite evals/data/v0.2.yaml

      - name: Run research evaluations
        run: python -m quant_agent.cli eval research --suite evals/research/v0.3.yaml

      - name: Verify data snapshot smoke flow
        run: |
          python -m quant_agent.cli data snapshot \
            --config configs/env/dev.yaml \
            --project-root /tmp/quant-agent-smoke \
            --as-of 2026-05-21T16:00:00+08:00

      - name: Verify snapshot research smoke flow
        run: |
          output=$(python -m quant_agent.cli data snapshot \
            --provider synthetic-research \
            --config configs/env/dev.yaml \
            --project-root /tmp/quant-agent-research \
            --as-of 2026-05-22T16:00:00+08:00)
          snapshot_dir=$(printf '%s\n' "$output" | awk -F': ' '/snapshot_dir:/ {print $2}')
          test -n "$snapshot_dir"
          python -m quant_agent.cli research snapshot \
            --snapshot "$snapshot_dir" \
            --config configs/research/snapshot_baseline.yaml \
            --env-config configs/env/dev.yaml \
            --project-root /tmp/quant-agent-research

      - name: Verify contract schema export
        run: python -m quant_agent.cli contracts export --output /tmp/quant-agent-contracts

  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff
        shell: bash
        run: |
          set -o pipefail
          mkdir -p static-results
          ruff check src tests scripts --output-format=concise 2>&1 | tee static-results/ruff.txt

      - name: Upload Ruff diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-diagnostics
          path: static-results/ruff.txt
          if-no-files-found: error
          retention-days: 3

      - name: Run mypy
        shell: bash
        run: |
          set -o pipefail
          mkdir -p static-results
          mypy src 2>&1 | tee static-results/mypy.txt

      - name: Upload mypy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-diagnostics
          path: static-results/mypy.txt
          if-no-files-found: error
          retention-days: 3
